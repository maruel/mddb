# CI workflow: build, lint, and test on pushes and pull requests.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches-ignore: [gh-pages]
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          #- macos-latest
          #- windows-latest
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      # Setup
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      # Lint
      - name: Verify (format check and lint)
        if: runner.os == 'Linux'
        run: make verify
      # Build & Test
      - name: Build and verify the generated files are committed
        if: runner.os == 'Linux'
        run: |
          make build
          status=$(git status --porcelain)
          [ -z "$status" ] || { echo 'The build left a dirty worktree; commit the generated files it rewrote:' >&2; echo "$status" >&2; exit 1; }
      - name: Test
        if: runner.os != 'Linux'
        run: make test
      - name: Coverage
        if: runner.os == 'Linux'
        run: make coverage
      - name: Upload Coverage
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out,coverage/lcov.info
      # E2E
      - run: make test-e2e
      - uses: actions/upload-artifact@v7
        id: playwright-report
        if: always()
        with:
          name: playwright-report-${{ runner.os }}
          path: playwright-report/
          retention-days: 7
      - name: Playwright Report Summary
        if: always()
        run: |
          report=playwright-report/results.json
          [ -f "$report" ] || exit 0
          PASSED=$(jq '.stats.expected' "$report")
          FAILED=$(jq '.stats.unexpected' "$report")
          SKIPPED=$(jq '.stats.skipped' "$report")
          FLAKY=$(jq '.stats.flaky' "$report")
          TOTAL=$((PASSED + FAILED + SKIPPED + FLAKY))
          {
            echo "## Playwright Test Results (${{ runner.os }})"
            echo ""
            if [ "$FAILED" -gt 0 ]; then
              echo "| Status | Count |"
              echo "|--------|-------|"
              echo "| :white_check_mark: Passed | $PASSED |"
              echo "| :x: Failed | $FAILED |"
              [ "$FLAKY" -gt 0 ] && echo "| :warning: Flaky | $FLAKY |"
              [ "$SKIPPED" -gt 0 ] && echo "| :fast_forward: Skipped | $SKIPPED |"
              echo ""
            else
              echo ":white_check_mark: **All $TOTAL tests passed on ${{ runner.os }}**"
            fi
            echo ""
            echo ":page_facing_up: Playwright report for ${{ runner.os }} is available as a workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"
