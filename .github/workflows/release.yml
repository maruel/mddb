# Publish checksummed mddb archives on version tags pushed to maruel/mddb.
name: Release mddb
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'maruel/mddb'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            Makefile
            go.mod
            go.sum
      - run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
