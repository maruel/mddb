# mddb instance configuration.
#
# Copy to ~/.config/mddb/config.toml, or pass -config-dir DIR to read it from
# elsewhere. Every key below is commented out with its default value; uncomment
# a line to override it. Uncommenting every directive reproduces the built-in
# defaults. A malformed file or an unknown key stops startup with the offending
# path.
#
# The file holds client secrets, so keep it readable by the server account only:
#   install -m 600 contrib/config.toml ~/.config/mddb/config.toml

# Check stable releases daily at 04:50 local time, with up to five minutes of
# random delay. Uses five-field cron syntax. Empty disables automatic updates.
# Development, dirty and prerelease builds never update themselves.
#auto_update = "50 4 * * *"

# ── Server ───────────────────────────────────────────────────────────────────

[server]
# Address to listen on (e.g., localhost:8080, :8080, 0.0.0.0:8080). Use
# 0.0.0.0:port to listen on all interfaces.
#http = "localhost:8080"

# Directory holding the content repositories and db/. A relative path resolves
# against the working directory, not the config directory; the bundled systemd
# unit sets WorkingDirectory=%h/mddb, so the default puts content in
# ~/mddb/data.
#data_dir = "data"

# Public base URL for OAuth callbacks (e.g., https://example.com). A localhost
# URL without a port uses the port from http.
#base_url = "http://localhost"

# MaxMind MMDB file for IP geolocation. A relative path resolves against the
# config directory. Empty skips country enrichment.
# https://dev.maxmind.com/geoip/geolite2-free-geolocation-data
#geo_db = ""  # e.g. "GeoLite2-Country.mmdb"

# Optional allowed origins; [] disables filtering, including with geo_db set.
# Country codes require geo_db and must occur in it. Also accepts CIDRs or
# local, tailscale, anthropic, github and openai.
# Example: ["CA", "US", "local", "tailscale", "192.0.2.0/24"].
# Unknown origins are denied when filtering is enabled. GitHub/OpenAI ranges
# cache for 24 hours in the OS user cache directory under mddb/.
#allow_origins = []

# Address prefixes of the reverse proxies directly in front of mddb. Only a
# request from one of them may set the client IP through X-Forwarded-For or
# X-Real-IP. The client IP keys per-IP rate limits, sessions, and logs. Leave
# empty when clients connect directly. Behind a proxy on the same host, set
# ["127.0.0.1/32", "::1/128"]; otherwise every client shares the proxy's address.
#trusted_proxies = []

# ── OAuth ────────────────────────────────────────────────────────────────────
# Each provider takes a client ID and its client secret. Set both or neither;
# an incomplete pair stops startup. Providers with no credentials stay hidden.

[oauth.google]
# Create an OAuth 2.0 Client ID at https://console.cloud.google.com/apis/credentials
# Redirect URI: <base_url>/api/v1/auth/oauth/google/callback
#client_id = ""
#client_secret = ""

[oauth.microsoft]
# Register an application at https://portal.azure.com/
# Redirect URI: <base_url>/api/v1/auth/oauth/microsoft/callback
#client_id = ""
#client_secret = ""

[oauth.github]
# Create an OAuth App at https://github.com/settings/developers
# Redirect URI: <base_url>/api/v1/auth/oauth/github/callback
#client_id = ""
#client_secret = ""

# ── GitHub App ───────────────────────────────────────────────────────────────
# Enables bidirectional sync between workspaces and GitHub repositories: edits
# auto-push and GitHub pushes trigger a pull. Set both id and private_key_file
# or neither.

[github.app]
# App ID shown on the app settings page, created at https://github.com/settings/apps/new
#id = 0
# PEM private key file. A relative path resolves against the config directory.
#private_key_file = ""  # e.g. "github-app.pem"
# Webhook secret for <base_url>/api/v1/webhooks/github; generate with
# openssl rand -hex 32. Empty accepts unverified webhook deliveries.
#webhook_secret = ""

# ── Voice Gateway ────────────────────────────────────────────────────────────

[voice-gateway]
# Voice starts only in embedded or external mode. Provider credentials never enable it.
#mode = "disabled"  # "disabled" (default), "embedded", or "external".
# External mode uses a standalone gateway and a stable public mddb origin.
#url = ""
#instance_id = ""
# "scoped" or "oauth". Tokens last five minutes and identify the logged-in user.
#token_mode = "scoped"
# Scoped mode uses a PKCS#8 Ed25519 key file relative to the config directory.
# Generate with openssl genpkey -algorithm Ed25519 -out voice-signing-key.pem.
# OAuth mode creates a private voice-oauth-key.pem in the config directory.
#signing_private_key_pem = ""

# UDP ICE mux: 0 assigns an ephemeral port, 1..65535 fixes the port.
# Use voice-gateway.mode to disable voice.
#webrtc_udp_port = 0

# Embedded mode serves Go Mode's voice choices and stages from voice-choices.toml
# beside this file. Without it, mddb uses the defaults built into this release:
# https://github.com/maruel/gomode/blob/main/voicegateway/voice-choices.toml
# Copy that file to customize it; a copy replaces the defaults entirely.
# mddb owns authentication and the HTTP listener. Credentials use each provider's
# native environment variables. Unavailable providers are hidden at startup.

# ── Debug ────────────────────────────────────────────────────────────────────

[debug]
# Log level: debug, info, warn, error.
#log_level = "info"
