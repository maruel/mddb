# golangci-lint configuration.
version: "2"
run:
  tests: true
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - commentcheck
    - contextcheck
    - copyloopvar
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - godot
    - gomoddirectives
    - goprintffuncname
    - gosec
    - gosmopolitan
    - grouper
    - iface
    - importas
    - inamedparam
    - iotamixing
    - loggercheck
    - makezero
    - methodfilecheck
    - mirror
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - revive
    - sloglint
    - sqlclosecheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    custom:
      commentcheck:
        type: module
        description: Exported declarations need doc comments starting with their name; doc comments must attach to their declaration.
        settings: {}
      methodfilecheck:
        type: module
        description: Methods must be declared in the same file as their receiver type, in one contiguous block.
        settings: {}
    gosec:
      excludes:
        - G117 # Struct fields named Password/Secret are not leaked secrets.
        - G703 # Taint-based path traversal: too many false positives.
        - G704 # Taint-based SSRF: flags all http.Client.Do calls.
        - G705 # Taint-based XSS: flags all ResponseWriter.Write calls.
        - G706 # Taint-based log injection: flags structured slog calls.
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    generated: lax
    rules:
      # OAuth destinations are configured providers or validated rooted paths;
      # gosec cannot follow loginReturnPath through the signed state envelope.
      - path: backend/internal/server/handlers/oauth\.go$
        linters: [gosec]
        text: "G710:"
        source: 'http.Redirect\(w, r, (authCodeURL\(config, provider, state\)|next),'
      - path: (.+)\.go$
        text: should have a package comment
      - path: _test\.go$
        text: "G101:"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      # Simplify the code the way gofmt -s does.
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
